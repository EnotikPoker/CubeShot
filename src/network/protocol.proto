syntax = "proto3";
package cubeshot.wire;
message Vec { float x = 1; float y = 2; }
message DamageMark { Vec local = 1; float width = 2; float depth = 3; uint32 weapon = 4; uint32 shooter = 5; uint32 volley = 6; }
message Surface { reserved 1; uint32 revision = 2; bool charred = 3; repeated Vec outline = 4; repeated DamageMark marks = 5; float scorch = 6; }
message Abilities { repeated uint32 levels = 1; }
message ActiveSlot { uint32 kind=1; float cooldown=2; }
message Player { uint32 id = 1; Vec position = 2; Vec velocity = 3; Vec aim = 4; uint32 health = 5; bool grounded = 6; float cooldown = 7; uint32 weapon = 8; float preparation = 9; bool charging = 10; uint32 shots = 11; float spin = 12; float heat = 13; bool overheated = 14; float burning = 15; uint32 burn_owner = 16; reserved 17; Surface surface = 18; float motion_phase = 19; float landing = 20; float lean = 21; uint32 ammo = 22; bool reloading = 23; float reload_remaining = 24; float push_x = 25; bool driven = 26; Abilities abilities = 27; float jetpack_fuel = 28; bool jetpack_active = 29; uint32 shields = 30; uint32 air_jumps = 31; bool second_chance_used = 32; float invulnerability = 33; float damage_quiet = 34; float healing_remainder = 35;
 repeated ActiveSlot active_slots=36; float barrier=37; float barrier_time=38; float bleeding=39; float bleed_tick=40; float bleed_power=41; uint32 bleed_owner=42;
 float dash_time=43; Vec dash_direction=44; bool slamming=45; float slam_time=46; float lunge_cooldown=47; uint32 combo_hits=48; uint32 combo_target=49; float combo_time=50; uint32 teleport_revision=51; uint32 active_serial=52; uint32 slam_volley=53; uint64 slam_sequence=54; repeated float effects=55; uint32 life=56; bool fresh_mag=57; uint32 economy=58; uint32 melee_hits=59; uint64 impulse_key=60; }
message Bullet { uint64 id = 1; Vec position = 2; Vec velocity = 3; uint32 shooter = 4; float lifetime = 5; uint64 shot_sequence = 6; uint32 weapon = 7; uint32 damage = 8; float gravity = 9; uint32 volley = 10; float age = 11; bool returning = 12; uint32 hit_mask = 13; float travelled = 14; float radius = 15; bool ignites = 16; uint32 ricochets = 17; uint32 penetrations = 18; float power = 19; float terrain_power = 20; float blast_scale = 21; float range_scale = 22; float spread_scale = 23; bool twinned = 24; uint32 active=25; float boom_out=26; float boom_return=27; float boom_range=28; float return_power=29; float leg_travel=30; Vec launch_direction=31; uint32 circuits=32; uint32 owner_life=33; uint32 reflections=34; uint32 bounces=35; bool secondary=36; bool area=37; uint32 blast_damage=38; float blast_radius=39; uint32 terrain_damage=40; float terrain_radius=41; }
message Piece { uint64 id = 1; uint32 owner = 2; Vec position = 3; Vec velocity = 4; Vec size = 5; float angle = 6; float spin = 7; repeated Vec outline = 8; Vec skin_offset = 9; uint32 integrity = 10; uint32 revision = 11; bool charred = 12; uint32 kind = 13; bool eye_attached = 14; Vec eye = 15; float life = 16; float visual_scale = 17; }
message Fire { uint64 id = 1; uint32 owner = 2; Vec position = 3; float life = 4; float radius = 5; }
message Corpse { Piece body = 1; uint32 integrity = 2; reserved 3; uint32 cause = 4; }
message RuleChoice { uint32 wins = 1; uint64 selection_revision = 2; uint32 mode=3; uint32 stages=4; uint32 control_goal=5; uint32 format=6; uint32 participants=7; bool friendly_fire=8; }
message RespawnState { uint32 life=1; float remaining=2; float decision=3; bool choosing=4; }
message ModeState { uint32 chaos=1; uint32 next_chaos=2; float elapsed=3; float zone_remaining=4; uint32 zone=5; repeated float control=6; repeated RespawnState respawn=7; }
message Entity { uint64 id=1; uint32 kind=2; Vec position=3; Vec velocity=4; Vec size=5; Vec anchor=6; float life=7; float fuse=8; float arm=9; uint32 health=10; uint32 attached=11; uint32 attached_life=12; bool anchored=13; Bullet source=14; }
message Snapshot {
  uint64 tick = 1; uint32 round = 2; uint32 phase = 3; float remaining = 4;
  repeated uint32 score = 5; repeated bool connected = 6; repeated bool ready = 7;
  uint32 winner = 8; uint32 aborted = 9; repeated Player players = 10; repeated Bullet bullets = 11;
  repeated uint64 input_ack = 12; repeated uint64 action_ack = 13; repeated string names = 14;
  uint32 map = 15; bool voting = 16; repeated sint32 votes = 17; uint64 selection_revision = 18; uint64 state_sequence = 19;
  repeated Corpse corpses = 20; repeated Piece pieces = 21;
  repeated uint32 loadout = 22; repeated uint32 rolled = 23;
  repeated uint32 weapon_choice = 24; repeated float spin_remaining = 25; repeated Fire fires = 26; repeated Abilities abilities = 27; repeated uint32 upgrade = 28; repeated uint32 rolled_ability = 29; uint32 wins = 30; bytes terrain_health = 31; uint64 terrain_revision = 32; repeated uint32 active_loadout=33; repeated uint32 rolled_active=34; uint32 rules_mode=35; uint32 stages=36; uint32 control_goal=37; ModeState mode_state=38; repeated Entity entities=39;
 uint32 format=40; uint32 participants=41; bool friendly_fire=42; repeated uint32 slots=43; repeated uint32 teams=44; repeated uint32 difficulty=45; repeated uint32 team_score=46; uint32 winner_team=47; uint32 host=48; float decision_remaining=49;
}
message Hello { string owner_token = 1; string nickname = 2; string reservation_token = 3; }
message Welcome { uint32 player_id = 1; }
message InputCommand { uint64 sequence = 1; float movement = 2; Vec aim = 3; bool fire_held = 4; bool jump_held = 5; uint32 life=6; }
message Control { uint64 sequence = 1; uint32 round = 2; float movement = 3; Vec aim = 4; repeated InputCommand commands = 5; }
message Action { uint64 sequence = 1; uint32 round = 2; bool jump = 3; bool shoot = 4; Vec aim = 5; uint64 input_sequence = 6; bool reload = 7; uint32 active_mask=8; uint32 life=9; }
message Ready { bool ready = 1; uint64 selection_revision = 2; }
message MapChoice { uint32 map = 1; bool change = 2; uint64 selection_revision = 3; }
message GameEvent { uint64 id = 1; uint64 tick = 2; uint64 shot_sequence = 3; uint32 round = 4; uint32 kind = 5; uint32 actor = 6; uint32 target = 7; Vec position = 8; Vec direction = 9; uint32 damage = 10; uint32 weapon = 11; uint32 volley = 12; Vec local = 13; uint32 surface_revision = 14; uint32 volley_damage = 15; float radius = 16; uint32 active=17; uint32 life=18; uint32 target_life=19; }
message Events { repeated GameEvent events = 1; }
message WeaponChoice { bool reroll = 1; uint32 round = 2; uint64 selection_revision = 3; uint32 upgrade = 4; uint32 life=5; }
message SlotChoice { uint32 slot=1; uint32 kind=2; uint32 difficulty=3; uint32 team=4; bool own_team=5; uint64 revision=6; }
message Empty {}
message Envelope {
  uint32 protocol = 1;
  oneof body { Hello hello = 2; Welcome welcome = 3; Control control = 4; Action action = 5;
    Ready ready = 6; Empty leave = 7; Snapshot snapshot = 8; Empty heartbeat = 9; MapChoice map_choice = 10; Events events = 11; WeaponChoice weapon_choice = 12; RuleChoice rule_choice = 13; SlotChoice slot_choice=14; }
}
message DiscoveryQuery { uint32 protocol = 1; uint64 nonce = 2; }
message DiscoveryRoom { uint32 protocol = 1; uint64 nonce = 2; uint32 port = 3; uint32 players = 4; bool joinable = 5; string name = 6; uint32 capacity=7; uint32 bots=8; uint32 format=9; uint32 mode=10; }
