name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf autoconf-archive automake libtool libtool-bin libltdl-dev autopoint pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev wayland-protocols
      - name: Bootstrap pinned vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/cubeshot-vcpkg"
          git -C "$RUNNER_TEMP/cubeshot-vcpkg" checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/cubeshot-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/cubeshot-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Verify Linux autotools prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          check_dir="$RUNNER_TEMP/cubeshot-autotools-check"
          mkdir -p "$check_dir"
          cp "$RUNNER_TEMP/cubeshot-vcpkg/ports/vcpkg-make/configure.ac" "$check_dir/configure.ac"
          cd "$check_dir"
          if ! aclocal --dry-run >aclocal.log 2>&1; then
            cat aclocal.log
            exit 1
          fi
          cat aclocal.log
          if grep -q 'System package .* is missing' aclocal.log; then
            exit 1
          fi
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/cubeshot-vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          build_args=(--build build --config Release --parallel 4)
          if [ "$RUNNER_OS" = "Windows" ]; then
            build_args+=(--verbose -- -fileLogger "-fileLoggerParameters:LogFile=msbuild.log;Verbosity=normal;Encoding=UTF-8")
          fi
          cmake "${build_args[@]}" 2>&1 | tee build/build.log
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Build and test without SDL
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build-headless -DCMAKE_BUILD_TYPE=Release -DCUBESHOT_BUILD_CLIENT=OFF -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/cubeshot-vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" -DVCPKG_MANIFEST_INSTALL=OFF
          cmake --build build-headless --parallel 4
          ctest --test-dir build-headless --output-on-failure --parallel 2
      - name: Upload programs and runtime libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CubeShot-${{ runner.os }}-0.9.0
          path: build/bin/
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CI-logs-${{ runner.os }}-0.9.0
          if-no-files-found: warn
          path: |
            build/build.log
            build/msbuild.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/vcpkg-manifest-install.log
            build/Testing/Temporary/
            ${{ runner.temp }}/cubeshot-vcpkg/buildtrees/**/*.log
